<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini FPS Estilo Shell Shockers</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb; }
canvas { display:block; }
#ui { position:absolute; top:10px; left:10px; color:white; font-family:Arial; z-index:100; }
#armaSkin { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); width:120px; border:2px solid white; }
#flash { position:absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; }
button { padding:5px 10px; margin:5px; cursor:pointer; }
</style>
</head>
<body>
<div id="ui">
    <div>Puntos: <span id="puntos">0</span></div>
    <div>Arma actual: <span id="armaActual">Pistola</span></div>
    <button onclick="cambiarArma()">Cambiar Arma</button>
</div>

<img id="armaSkin" src="https://i.imgur.com/8f9qZcE.png">
<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
// ESCENA Y CÁMARA
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.y = 1.5;
camera.position.z = 5;

// LUZ SIMPLE
scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5,10,5));
scene.add(new THREE.AmbientLight(0xaaaaaa));

// SUELO SIMPLE
const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50,50),
    new THREE.MeshStandardMaterial({color:0x228B22})
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// CUBOS ENEMIGOS (PRUEBA)
const skinsCubos = [
    'https://i.imgur.com/3X9JwzC.png',
    'https://i.imgur.com/3W3bV8L.png',
    'https://i.imgur.com/oC8F0QG.png'
];
let cubos = [];
for(let i=0;i<5;i++){
    let geo = new THREE.BoxGeometry(1,1,1);
    let mat = new THREE.MeshStandardMaterial({ map: new THREE.TextureLoader().load(skinsCubos[i%skinsCubos.length]) });
    let cube = new THREE.Mesh(geo, mat);
    cube.position.set(Math.random()*10-5,0.5,-Math.random()*20-5);
    scene.add(cube);
    cubos.push(cube);
}

// ARMAS CON SKINS
const armas = [
    {nombre:"Pistola", daño:1, cadencia:0.5, skin:"https://i.imgur.com/8f9qZcE.png"},
    {nombre:"Escopeta", daño:3, cadencia:1, skin:"https://i.imgur.com/7J4kSgD.png"},
    {nombre:"AK-47", daño:2, cadencia:0.2, skin:"https://i.imgur.com/AbCdEf1.png"},
    {nombre:"Sniper", daño:5, cadencia:1.5, skin:"https://i.imgur.com/XyZAbc2.png"}
];
let armaIndex=0;
const armaSpan=document.getElementById("armaActual");
const armaSkin=document.getElementById("armaSkin");
const flash=document.getElementById("flash");

function cambiarArma(){
    armaIndex = (armaIndex+1)%armas.length;
    armaSpan.textContent = armas[armaIndex].nombre;
    armaSkin.src = armas[armaIndex].skin;
}

// PUNTOS
let puntos=0;
const puntosDiv=document.getElementById("puntos");

// MOVIMIENTO FPS
const keys={};
document.addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);
function moverCamara(){
    if(keys['w']) camera.position.z -= 0.2;
    if(keys['s']) camera.position.z += 0.2;
    if(keys['a']) camera.position.x -= 0.2;
    if(keys['d']) camera.position.x += 0.2;
}

// DISPARO CON FLASH
let lastShot=0;
window.addEventListener("click", ()=>{
    let now = Date.now();
    if(now - lastShot < armas[armaIndex].cadencia*500) return;
    lastShot = now;

    flash.style.opacity=0.5;
    setTimeout(()=>{flash.style.opacity=0},50);

    let raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    let intersects = raycaster.intersectObjects(cubos);
    if(intersects.length>0){
        puntos += armas[armaIndex].daño;
        puntosDiv.textContent = puntos;
        intersects[0].object.position.set(Math.random()*10-5,0.5,-Math.random()*20-5);
    }
});

// ANIMACIÓN
function animate(){requestAnimationFrame(animate); moverCamara(); renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
